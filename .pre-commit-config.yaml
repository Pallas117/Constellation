# Git hooks: secrets, files that must never be committed, hygiene, lint and commit messages.
# GitHub Actions are off, so these hooks and the local gates are the checks before review.
# Install: npm run security:setup-hooks (npm run dev:setup does it too).
# Run on everything: pre-commit run --all-files
# The TruffleHog hook needs TruffleHog 3 on PATH (brew install trufflehog; the dev container has it).

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Staged files only; fails on secrets that work or can't be checked (scripts/check-secrets-local.sh).
      - id: trufflehog
        name: TruffleHog (secrets in staged files)
        entry: bash scripts/check-secrets-local.sh
        language: system
        types: [text]
      - id: forbid-local-secret-files
        name: Never commit .env*, .auth.db or data/mesh/
        entry: "These hold local secrets, sign-in accounts or device data. Unstage them (git restore --staged <file>):"
        language: fail
        files: '(^|/)\.env(\..+)?$|(^|/)\.auth\.db|^data/mesh/'
        exclude: '(^|/)\.env\.example$'
      # The repo's own ESLint and flat config (eslint.config.js), from node_modules.
      - id: eslint
        name: ESLint (staged files)
        entry: npx --no-install eslint --fix --no-warn-ignored
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs)$

  # Entropy and keyword checks; known false positives live in .secrets.baseline
  # (update: detect-secrets scan --baseline .secrets.baseline, then audit it).
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-case-conflict
      - id: check-json
        # tsconfig and devcontainer files are JSON with comments; the descriptor is protobuf text.
        exclude: '(^|/)(tsconfig[^/]*|devcontainer)\.json$|^shared/proto/telemetry_descriptor\.json$'
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']

  # Conventional Commits (feat:, fix:, docs: ...); merge commits are allowed.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

exclude: |
  (?x)^(
    build/|
    dist/|
    node_modules/|
    frontend/dist/|
    package-lock\.json
  )
