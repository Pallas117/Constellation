# systemd drop-in for Ollama on Talos: keep the model loaded and the prompt prefix cached.
# Install (Josh, with sudo): see "Ollama keep-alive (Josh runs this)" in README.md.
# Settings: https://docs.ollama.com/faq
#   OLLAMA_KEEP_ALIVE=30m     keep the model in memory 30 min after the last request (default 5 min)
#   OLLAMA_CONTEXT_LENGTH=8192 fixed context so the cached prefix is not rebuilt when the size changes
#   OLLAMA_NUM_PARALLEL=1     one request at a time: the whole context budget serves one prefix
# Measured 26 Nov 2026 (repeated 3,200-token prefix): Talos 140.8 s -> 3.5 s to first token.
[Service]
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_CONTEXT_LENGTH=8192"
Environment="OLLAMA_NUM_PARALLEL=1"
