name: Code Signing & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  sign-release:
    name: Sign & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build project
        run: npm run build

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Generate SBOM
        run: |
          npm install -g @cyclonedx/npm
          cyclonedx-npm --output-file sbom.json

      - name: Create checksums
        run: |
          cd dist || cd frontend/dist
          sha256sum -r . > ../checksums.txt

      - name: Sign artifacts with Cosign
        run: |
          # Sign SBOM
          cosign sign-blob \
            --yes \
            sbom.json > sbom.json.sig
          
          # Sign checksums
          cosign sign-blob \
            --yes \
            checksums.txt > checksums.txt.sig
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Create Release Notes
        id: release_notes
        run: |
          tag_name="${{ github.ref_name }}"
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$previous_tag" ]; then
            changelog=$(git log --pretty=format:"%h - %s" | head -20)
          else
            changelog=$(git log ${previous_tag}..HEAD --pretty=format:"%h - %s" | head -20)
          fi
          
          {
            echo "# Release $tag_name"
            echo ""
            echo "## Changes"
            echo "\`\`\`"
            echo "$changelog"
            echo "\`\`\`"
            echo ""
            echo "## Security"
            echo "- ✅ Code signed with Cosign"
            echo "- ✅ SBOM generated and signed"
            echo "- ✅ Checksums available for verification"
            echo ""
            echo "## Verification"
            echo "Verify artifacts:"
            echo "\`\`\`bash"
            echo "cosign verify-blob --signature sbom.json.sig sbom.json"
            echo "sha256sum -c checksums.txt"
            echo "\`\`\`"
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sbom.json
            sbom.json.sig
            checksums.txt
            checksums.txt.sig
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  slsa-provenance:
    name: Generate SLSA v1.0 Provenance
    runs-on: ubuntu-latest
    needs: sign-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Provenance
        uses: slsa-framework/slsa-github-generator@v2.1.0
        with:
          base64-subjects: ${{ needs.sign-release.outputs.build-outputs-sha256 }}
          upload-assets: true

  publish-sbom:
    name: Publish SBOM to GitHub
    runs-on: ubuntu-latest
    needs: sign-release
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Upload SBOM to Dependency Graph
        uses: anchore/sbom-action@v0
        with:
          path: sbom.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
