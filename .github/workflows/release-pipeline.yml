name: Build & Release Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  validate-release-readiness:
    name: Release Readiness Check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run pre-release gates
        run: |
          echo "🔐 Running pre-release security gates..."
          
          # 1. Full adherence audit
          echo "1️⃣  Running full adherence audit..."
          npm run audit:adherence || exit 1
          
          # 2. Security compliance
          echo "2️⃣  Running security compliance check..."
          npm run check:security-compliance || exit 1
          
          # 3. RBAC tests
          echo "3️⃣  Running RBAC smoke tests..."
          npm run test:rbac || echo "⚠️  RBAC tests require Supabase (optional for CI)"
          
          # 4. Type checking
          echo "4️⃣  Running TypeScript check..."
          npm run lint || exit 1
          
          # 5. Build verification
          echo "5️⃣  Building project..."
          npm run build || exit 1
          
          echo "✅ All pre-release gates passed!"
        env:
          AUTH_REQUIRED: "true"
          CYBERTIGER_ENABLED: "true"
          RBAC_SKIP_HEALTH_CHECK: "true"

  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend
        run: npm run build

      - name: Build backend (type check)
        run: npm run lint

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: frontend/dist/
          retention-days: 30

  auto-version:
    name: Auto Version & Changelog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build]
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Determine version bump
        id: version
        run: |
          # Get last tag
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          last_version=${last_tag#v}
          
          # Get commit messages since last tag
          commit_msgs=$(git log $last_tag..HEAD --pretty=format:"%s" 2>/dev/null || git log HEAD~10..HEAD --pretty=format:"%s")
          
          # Determine bump type (conventional commits)
          if echo "$commit_msgs" | grep -q "^BREAKING\|^feat!"; then
            bump="major"
          elif echo "$commit_msgs" | grep -q "^feat"; then
            bump="minor"
          else
            bump="patch"
          fi
          
          echo "Last version: $last_version"
          echo "Bump type: $bump"
          echo "new-version=$bump" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~20")
          changelog=$(git log $last_tag..HEAD --pretty=format:"- %s (%an)")
          
          {
            echo "changelog<<EOF"
            echo "## Changes"
            echo ""
            echo "$changelog"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Comment PR with version info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📦 **Build Status**: ✅ PASSED\n\nMerging will trigger: **${{ steps.version.outputs.new-version }}** version bump`
            });

  database-migration-check:
    name: Database Migration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for migrations
        run: |
          echo "🗄️  Validating database migrations..."
          
          if [ -d "supabase/migrations" ]; then
            migration_count=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
            echo "Found $migration_count migrations"
            
            # Check for common issues
            for file in supabase/migrations/*.sql; do
              if [ -f "$file" ]; then
                # Check for syntax errors (basic)
                if ! grep -q "CREATE\|ALTER\|INSERT\|UPDATE" "$file"; then
                  echo "⚠️  $file may have no DDL statements"
                fi
              fi
            done
            
            echo "✅ Migrations validated"
          else
            echo "ℹ️  No migrations directory found"
          fi

      - name: Comment PR with migration status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🗄️  **Database Migrations**: Validated. Ensure migrations are applied before deployment.`
            });

  health-check:
    name: Health Check Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /health endpoint
        run: |
          echo "🏥 Checking health check implementation..."
          
          if grep -r "app.get.*health\|router.get.*health" backend/ 2>/dev/null; then
            echo "✅ Health check endpoint found"
          else
            echo "❌ No health check endpoint found"
            echo "Please add: app.get('/health', (req, res) => res.json({ status: 'ok' }))"
            exit 1
          fi

status-check:
    name: Release Pipeline Status
    runs-on: ubuntu-latest
    needs: [build, auto-version, database-migration-check, health-check]
    if: always()
    steps:
      - name: Check pipeline status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          echo "✅ Release pipeline ready"
