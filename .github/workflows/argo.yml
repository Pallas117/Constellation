name: Argo (Go)

# Checks for tools/argo, the standalone Go module. Until this workflow existed
# Argo had no CI of its own: only `go test -short` inside the local ops gate.

on:
  pull_request:
    paths:
      - "tools/argo/**"
      - ".github/workflows/argo.yml"
  push:
    branches:
      - main
    paths:
      - "tools/argo/**"
      - ".github/workflows/argo.yml"

permissions:
  contents: read

concurrency:
  group: argo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, vet, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/argo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/argo/go.mod
          cache: false # standard library only: nothing to cache

      - name: Standard library only
        run: |
          if [ -s go.sum ]; then
            echo "tools/argo must not have dependencies (go.sum is not empty)"; exit 1
          fi
          if grep -qE '^\s*require\b' go.mod; then
            echo "tools/argo must not have dependencies (go.mod has a require)"; exit 1
          fi

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt-clean:"; echo "$out"; exit 1; fi

      - name: go vet (Linux and macOS)
        run: |
          go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...

      - name: Build (linux/amd64, linux/arm64, darwin/arm64)
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -o /dev/null .
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .

      - name: Tests with the race detector
        env:
          ARGO_NO_DESKTOP: "1"
        run: go test -race ./...
