# Dependency updates. GitHub Actions minutes are billing-locked, so nothing here
# is tested by CI: each PR is gated locally (the five gates, plus the Argo Go
# suite in tools/argo) before merge. To keep the open-PR count down, routine
# bumps arrive as one grouped PR per ecosystem; majors stay separate because
# they need reading. Security fixes come straight away, grouped.
# A 7-day cooldown keeps brand-new releases (the window most supply-chain
# attacks use) out of non-security PRs.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "gomod"
    directory: "/tools/argo"
    schedule:
      interval: "monthly"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(argo)"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(docker)"

  # Workflows are disabled (billing lock); monthly and grouped so pins don't rot.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    labels: ["ci"]
    commit-message:
      prefix: "ci(actions)"
